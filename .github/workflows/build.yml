name: Build Snap

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: canonical/action-build@v1.3.0
        id: snapcraft
        with:
          snapcraft-channel: 9.x/stable
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-jira-server
          path: ${{ steps.snapcraft.outputs.snap }}